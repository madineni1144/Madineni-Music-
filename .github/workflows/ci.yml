name: ci

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  backend:
    # Make this job a REQUIRED status check on main (Settings -> Branches).
    name: backend tests (security route tests must run, never skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        env:
          MUSICAPP_ALLOW_BLOCKED_ROUTE_TESTS: ""   # never allowed in CI
        run: npm test 2>&1 | tee test-output.txt
      - name: Fail if any test was skipped or marked todo
        working-directory: backend
        run: |
          if grep -E "# (SKIP|TODO)" test-output.txt; then
            echo "Skipped/todo tests are not allowed in CI (security tests must execute)."; exit 1
          fi
          grep -E "^# (tests|pass|fail|skipped|todo)" test-output.txt

  pipeline-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python -m unittest discover -s audio_pipeline/tests -v
      - run: python -m py_compile audio_pipeline/scripts/*.py

  airflow-image:
    name: airflow image imports (separate test tag, no DAGs started)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t music-airflow:ci-test airflow/
      - run: bash scripts/verify_airflow_image.sh music-airflow:ci-test
