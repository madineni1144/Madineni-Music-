name: ci

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  backend:
    # Make this job a REQUIRED status check on main (Settings -> Branches).
    name: backend tests (security route tests must run, never skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        shell: bash   # GitHub's bash shell runs with -eo pipefail, so a failing npm test fails the step through tee
        env:
          MUSICAPP_ALLOW_BLOCKED_ROUTE_TESTS: ""   # never allowed in CI
        run: |
          set -o pipefail   # explicit, in case the shell default ever changes
          npm test 2>&1 | tee test-output.txt
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.txt
          if-no-files-found: warn
      - name: Fail if any test was skipped or marked todo
        working-directory: backend
        run: |
          if grep -E "# (SKIP|TODO)" test-output.txt; then
            echo "Skipped/todo tests are not allowed in CI (security tests must execute)."; exit 1
          fi
          grep -E "^# (tests|pass|fail|skipped|todo)" test-output.txt

  backend-integration:
    # Make this job a REQUIRED status check on main (Settings -> Branches).
    name: backend integration (disposable PostgreSQL, synthetic data only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway container on the runner network: no password exists to leak
          POSTGRES_DB: musicapp_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d musicapp_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run integration tests
        working-directory: backend
        shell: bash
        env:
          MUSICAPP_ALLOW_BLOCKED_ROUTE_TESTS: ""   # never allowed in CI
          MUSICAPP_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/musicapp_test_ci
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-output.txt
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-output
          path: backend/integration-output.txt
          if-no-files-found: warn
      - name: Fail on skipped/todo tests or a suspiciously small run
        working-directory: backend
        run: |
          if grep -E "# (SKIP|TODO)" integration-output.txt; then
            echo "Skipped/todo integration tests are not allowed in CI."; exit 1
          fi
          grep -E "^# (tests|pass|fail|skipped|todo)" integration-output.txt
          tests=$(grep -E "^# tests " integration-output.txt | awk '{print $3}')
          pass=$(grep -E "^# pass " integration-output.txt | awk '{print $3}')
          test "${tests:-0}" -ge 8 && test "$tests" = "$pass"

  gate-self-test:
    name: CI gate self-test (a failing command piped through tee must fail its step)
    runs-on: ubuntu-latest
    steps:
      - name: Controlled failing command (expected to fail)
        id: controlled
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          sh -c 'echo "controlled failure"; exit 1' 2>&1 | tee controlled.txt
      - name: Assert the failure propagated
        run: |
          echo "controlled step outcome: ${{ steps.controlled.outcome }}"
          test "${{ steps.controlled.outcome }}" = "failure"
          grep -q "controlled failure" controlled.txt   # the log was still captured
      - name: Show that the old pattern (no pipefail) would have hidden it
        shell: sh   # sh has no pipefail here: demonstrates the defect that was fixed
        run: |
          if sh -c 'sh -c "exit 1" | cat'; then echo "old pattern masks failures (expected)"; else exit 1; fi

  pipeline-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python -m unittest discover -s audio_pipeline/tests -v
      - run: python -m py_compile audio_pipeline/scripts/*.py

  airflow-image:
    name: airflow image imports (separate test tag, no DAGs started)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t music-airflow:ci-test airflow/
      - run: bash scripts/verify_airflow_image.sh music-airflow:ci-test
