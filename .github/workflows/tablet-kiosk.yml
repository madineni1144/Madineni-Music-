name: Build Samsung Tablet Kiosk APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/samsung-kiosk]
    paths: ['tablet-kiosk/**', '*.gradle.kts', '.github/workflows/tablet-kiosk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle :tablet-kiosk:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Madineni-Music-Samsung-Kiosk-APK
          path: tablet-kiosk/build/outputs/apk/debug/*.apk
          retention-days: 30
